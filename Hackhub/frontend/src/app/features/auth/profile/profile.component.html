<div class="row justify-content-center"><div class="col-12 col-lg-8"><section class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
  <p class="text-uppercase small fw-bold text-primary mb-2">Account</p><h1 class="h3 fw-bold mb-1">Il mio profilo</h1><p class="text-secondary mb-4">Gestisci i dati del tuo account HackHub.</p>
  @if (error(); as message) { <div class="alert alert-danger">{{ message }}</div> }
  @if (success(); as message) { <div class="alert alert-success">{{ message }}</div> }
  @if (loading()) { <div class="text-center py-4"><div class="spinner-border text-primary"></div></div> }
  @else if (profile(); as dati) {
    <form (submit)="submit($event)"><div class="row g-3">
      <div class="col-12"><label class="form-label fw-semibold" for="name">Nome</label><input class="form-control" id="name" name="name" required maxlength="100" [value]="dati.name"></div>
      <div class="col-12"><label class="form-label fw-semibold" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required maxlength="254" [value]="dati.email"></div>
    </div><div class="mt-3 text-secondary small">Ruolo: {{ dati.role }}</div><button class="btn btn-primary mt-4" type="submit" [disabled]="saving()">Salva modifiche</button></form>
  }
</div></section></div></div>
