services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-hackhub}
      MARIADB_USER: ${DB_USER:-hackhub}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - hackhub
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-hackhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-hackhub}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      HACKHUB_SEED_DEMO: "false"
      HACKHUB_JWT_SECRET: ${HACKHUB_JWT_SECRET:?Set HACKHUB_JWT_SECRET in .env}
      HACKHUB_ACCESS_TOKEN_TTL: ${HACKHUB_ACCESS_TOKEN_TTL:-15m}
      HACKHUB_REFRESH_TOKEN_TTL_SECONDS: ${HACKHUB_REFRESH_TOKEN_TTL_SECONDS:-604800}
      HACKHUB_JWT_ISSUER: ${HACKHUB_JWT_ISSUER:-hackhub-api}
      HACKHUB_JWT_AUDIENCE: ${HACKHUB_JWT_AUDIENCE:-hackhub-web}
    expose:
      - "3000"
    networks:
      - hackhub
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    networks:
      - hackhub
    restart: unless-stopped

networks:
  hackhub:
    driver: bridge

volumes:
  mariadb_data:
